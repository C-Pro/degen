
name: Test and build

on:
  push:
    branches: [main,utama,master]
  pull_request:
    branches: [main,utama,master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        # Full history + tags: the store migration test reads the previous
        # schema from the db-release-<N> tag (pkg/store/sqlite_test.go).
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: "1.26.4"

    - name: Test
      run: go test -v -cover -race ./...

    - name: Build
      run: go build -v ./...
